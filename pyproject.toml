[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hardenagent"
version = "0.1.0"
description = "Local security auditor for self-hosted AI agent projects: configs, MCP servers, Docker, secrets."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Vinayaka Nadagouda" }]
keywords = ["ai-agents", "security", "mcp", "audit", "llm", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hardenagent = "hardenagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
